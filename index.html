const now=()=>new Date().toLocaleDateString('sv-SE');
const dday=date=>Math.round((new Date(date+'T12:00:00')-new Date(now()+'T12:00:00'))/86400000);

const save=()=>{try{localStorage.setItem('daje-v1',JSON.stringify(S));render();return true}catch(e){alert('Impossibile salvare: memoria del browser piena o non disponibile. Esporta un backup e libera spazio.');return false}};
function tabs(){const t=[['oggi','🏠','Oggi'],['ricette','🍳','Ricette'],['spesa','🛒','Spesa'],['dispensa','🧺','Dispensa'],['fitness','💪','Fitness']];$('tabs').innerHTML=t.map(([id,icon,n])=>`<button class="${S.tab===id?'active':''}" onclick="S.tab='${id}';save()"><span>${icon}</span>${n}</button>`).join('')}

function oggi(){return `<div class="row between"><div class="kicker">IL TUO BENESSERE, UN GIORNO ALLA VOLTA</div><button class="alt" onclick="customizeHome()">⚙️ Home</button></div><h2>Ciao! Pronto a dare il meglio? ✨</h2><div class="today-hero"><span class="big">🥑</span><b>Un passo alla volta.</b><p>Organizza i pasti, usa ciò che hai in casa e goditi il percorso.</p><button onclick="showTip()">✨ Consiglio del giorno</button></div><div class="action-row"><button class="action-tile" onclick="S.tab='ricette';save()"><span class="ico">🍳</span>Ricette</button><button class="action-tile" onclick="S.tab='spesa';save()"><span class="ico">🛒</span>Spesa</button><button class="action-tile" onclick="S.tab='dispensa';save()"><span class="ico">🥫</span>Dispensa</button></div>${eventCard()}${weekEventActive()?`<div class="card travel-home"><div class="row between"><div><b>🎒 Valigia & concerto</b><p class="muted">${travelChecklist().filter(x=>(S.travelChecks||{})[x[0]]).length} di ${travelChecklist().length} cose pronte</p></div><button onclick="showTravelSheet()">Apri checklist →</button></div><progress value="${travelChecklist().filter(x=>(S.travelChecks||{})[x[0]]).length}" max="${travelChecklist().length}"></progress></div>`:''}${recipeGallery()}${homeBlocks()}<div class="chiprow">${days.map((d,i)=>`<button class="${S.day===i?'':'alt'}" onclick="S.day=${i};save()">${d.slice(0,3)}</button>`).join('')}</div><h3>${days[S.day]} <button class="alt" onclick="editDayMenu(S.day)">✏️ Modifica pasti</button></h3><div class="card soft"><div class="row between"><div><b>📅 Planner settimanale</b><p class="muted" style="margin:4px 0">Sposta i pasti e scegli le porzioni.</p></div><button onclick="openPlanner()">Apri planner →</button></div></div>${getDayMenu(S.day).map(([n,cat])=>`<div class="card row between ${isPaidMeal(S.day,cat)?'paid-slot':''}"><div><span class="muted">${cat}${isPaidMeal(S.day,cat)?' · 🎟️ Offerto':' · '+getMealPortions(S.day,cat)+' persone'}</span><div><b>${esc(eventMealName(S.day,cat)||n)}</b></div></div><button class="alt" onclick="openMeal(${S.day},'${cat}')">${isPaidMeal(S.day,cat)?'Dettagli':'Apri ↗'}</button></div>`).join('')}<div class="card soft"><b>Movimento</b><p>${workoutForDay(S.day)>=0?'Workout '+['A','B','C'][workoutForDay(S.day)]+' · '+days[S.day]:'Recupero / camminata leggera'}</p><button onclick="S.tab='fitness';S.work=Math.max(0,workoutForDay(S.day));save()">Apri workout</button></div><div class="card"><b>Il tuo diario</b><p class="muted">Peso iniziale: 92 kg · obiettivo indicativo: 75 kg</p><div class="cols"><div><label>Peso (kg)</label><input id="logweight" type="number" step=".1" placeholder="92"></div><div><label>Dolore polsi (0–10)</label><input id="logpain" type="number" min="0" max="10" placeholder="0"></div><div><label>Energia (1–5)</label><input id="logenergy" type="number" min="1" max="5" placeholder="3"></div><div><label>Fame (1–5)</label><input id="loghunger" type="number" min="1" max="5" placeholder="3"></div></div><label>Note</label><textarea id="lognotes" placeholder="Come sono andati pasti, sonno, allenamenti?"></textarea><button onclick="addLog()">Salva diario</button>${S.logs.slice().reverse().slice(0,4).map(l=>`<div class="small muted" style="margin-top:9px">${esc(l.date)} · ${esc(l.weight||'—')} kg · polsi ${esc(l.pain||'—')}/10 · ${esc(l.notes||'')}</div>`).join('')}</div><div class="notice">Il piano è orientativo, non sostituisce le indicazioni del medico o di un dietista. Con dolore cronico ai polsi evita esercizi dolorosi e chiedi una valutazione clinica.</div>`}
function ricette(){const r=R[S.recipe], missing=r[2].filter(x=>Math.max(0,x[1]-stock(x[0],x[2]))>0);return `<div class="kicker">VIAGGIA CON IL GUSTO</div><h2>La cucina di Daje! 🍜</h2><button onclick="editCustomRecipe()">➕ Crea ricetta</button><button class="alt" onclick="openFavorites()">❤️ I miei preferiti (${(S.favorites||[]).length})</button><div class="search-field"><input id="recipe-search" placeholder="Cerca piatti o ingredienti…" oninput="searchRecipes(this.value)"></div><div id="recipe-search-results"></div><div class="chiprow">${R.map((rr,i)=>`<button class="${i===S.recipe?'':'alt'}" onclick="S.recipe=${i};save()">${foodEmoji(i)} ${esc(rr[0])}</button>`).join('')}</div><label>Scegli il piatto (quantità per 2 persone)</label><select onchange="S.recipe=+this.value;save()">${R.map((x,i)=>`<option value="${i}" ${i===S.recipe?'selected':''}>${esc(x[0])}</option>`).join('')}</select>${foodPhoto(S.recipe)}${S.recipe>=BUILTIN_RECIPES?`<div class="row"><button class="alt grow" onclick="editCustomRecipe(S.recipe)">✏️ Modifica ricetta</button><button class="alt grow" onclick="deleteCustomRecipe(S.recipe)">🗑 Elimina</button></div>`:''}<div class="row" style="margin:10px 0"><button class="alt grow" onclick="toggleFavorite(S.recipe)">${(S.favorites||[]).includes(S.recipe)?'❤️ Nei preferiti':'🤍 Salva preferito'}</button><button class="alt grow" onclick="choosePhoto(S.recipe)">📷 Cambia foto</button></div><div class="card soft"><h3>${esc(r[0])}</h3><span class="muted">⏱ ${r[1]} minuti · ${r[2].length-missing.length}/${r[2].length} ingredienti sufficienti</span><progress value="${r[2].length-missing.length}" max="${r[2].length}"></progress></div><h3>Ingredienti</h3>${r[2].map(p=>{let n=Math.max(0,p[1]-stock(p[0],p[2]));return `<div class="card"><div class="row between"><b>${esc(p[0])}</b><span class="pill ${n?'warn':'good'}">${n?'Mancano '+n+' '+p[2]:'Disponibile'}</span></div><p class="muted">Servono ${p[1]} ${p[2]} · In casa ${stock(p[0],p[2])} ${p[2]}</p><button class="alt" onclick="S.tab='dispensa';save()">+ Aggiorna dispensa</button></div>`}).join('')}<div class="card soft"><h3>🍽️ Ho cucinato questo piatto</h3><p class="muted">Scarica dalla dispensa le quantità usate, partendo dai lotti con scadenza più vicina. I prodotti mancanti non vengono sottratti.</p><button onclick="cookRecipe()">Conferma e aggiorna dispensa</button></div><button style="width:100%;margin:12px 0" onclick="startCooking()">👨‍🍳 Inizia a cucinare · modalità guidata</button><h3>Preparazione</h3><div class="card">${r[3].map((step,i)=>`<p><b>${i+1}.</b> ${esc(step)}</p>`).join('')}</div><div class="notice">Per il pollo del venerdì, verifica conservazione e tempi: la data di scadenza non garantisce da sola la sicurezza dopo l'apertura o la cottura.</div>`}

function spesaOriginale(){let cats=[...new Set(G.map(p=>p[3]))],count=G.filter(p=>need(p)>0).length;return `<h2>Spesa PIM</h2><div class="search-field"><input placeholder="Cerca nella lista…" oninput="filterCards(this.value,'shop-item')"></div><p class="muted">Via Isacco Newton · Obiettivo €100 per due persone. Prezzi non aggiornati in tempo reale.</p><div class="card soft"><div class="row between"><b>Da acquistare</b><b>${count} prodotti</b></div><label>Totale scontrino (€)</label><input type="number" step=".01" value="${esc(S.receipt)}" onchange="S.receipt=this.value;save()"><p class="small">${S.receipt!==''?'Differenza dal budget: '+(100-Number(S.receipt)).toFixed(2)+' €':'Inserisci il totale effettivo'}</p><button class="alt" onclick="copyShop()">📋 Copia lista</button></div>${cats.map(cat=>`<details open><summary>${esc(cat)}</summary>${G.filter(p=>p[3]===cat).map(p=>{let n=need(p),key=p[0];return `<div class="card shop-item" data-search="${esc(key.toLowerCase())}"><div class="row between"><div><b>${esc(key)}</b><div class="muted">Servono ${p[1]} ${p[2]} · Hai ${stock(key,p[2])} ${p[2]}</div><div><strong>${n?'Compra '+n+' '+p[2]:'✓ Già in casa'}</strong></div></div>${n?`<label style="display:flex;align-items:center;gap:5px"><input type="checkbox" ${S.bought[key]?'checked':''} onchange="S.bought[${JSON.stringify(key)}]=this.checked;save()">Preso</label>`:''}</div></div>`}).join('')}</details>`).join('')}<div class="notice">I prodotti indicati come sufficienti sono sottratti dalla lista; quelli oltre la scadenza «da consumarsi entro» non sono conteggiati se non congelati. Verifica sempre condizioni e quantità realmente utilizzabili.</div>`}
function dispensa(){let urgent=S.lots.filter(l=>l.type==='use'&&l.place!=='Freezer'&&dday(l.exp)<=3).length;return `<h2>Dispensa e scadenze</h2><div class="search-field"><input placeholder="Cerca nella dispensa…" oninput="filterCards(this.value,'pantry-item')"></div>${expiryPanel()}<div class="card soft"><b>${S.lots.length} lotti registrati · ${urgent} da controllare entro 3 giorni</b><p class="muted">Registra separatamente confezioni con date diverse. I dati restano salvati su questo browser.</p></div><div class="card"><h3>+ Aggiungi prodotto</h3><label>Ingrediente</label><input id="pn" list="ingredienti" placeholder="Es. Pollo"><datalist id="ingredienti">${[...new Set([...G.map(x=>x[0]),...R.flatMap(r=>r[2].map(x=>x[0]))])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="cols"><div><label>Quantità</label><input id="pq" type="number" min=".01" step="any" placeholder="500"></div><div><label>Unità</label><select id="pu"><option>g</option><option>pz</option><option>ml</option><option>conf</option><option>buste</option><option>teste</option><option>bustine</option><option>bottiglie</option></select></div><div><label>Data in etichetta</label><input id="pe" type="date" value="${now()}"></div><div><label>Tipo data</label><select id="pt"><option value="use">Da consumarsi entro</option><option value="best">Preferibilmente entro</option></select></div><div><label>Conservazione</label><select id="pl"><option>Frigorifero</option><option>Freezer</option><option>Dispensa</option></select></div><div><label>Stato</label><select id="po"><option value="chiusa">Chiusa</option><option value="aperta">Aperta</option></select></div></div><label>Nota apertura / conservazione</label><input id="pnote" placeholder="Es. aperto oggi, seguire etichetta"><button style="margin-top:12px;width:100%" onclick="addLot()">Salva in dispensa</button></div><h3>Scadenze ordinate</h3>${S.lots.length?S.lots.slice().sort((a,b)=>a.exp.localeCompare(b.exp)).map(l=>{let d=dday(l.exp),bad=d<0&&l.type==='use'&&l.place!=='Freezer';return `<div class="card pantry-item" data-search="${esc(l.name.toLowerCase())}"><div class="row between"><b>${esc(l.name)}</b><span class="pill ${bad?'danger':d<=3?'warn':'good'}">${bad?'Scaduto':d<0?'TMC passato':d===0?'Oggi':d>0?'Tra '+d+' gg':'Da verificare'}</span></div><p class="muted">${l.qty} ${esc(l.unit)} · ${esc(l.place)} · ${esc(l.opened)}<br>${esc(l.exp)} · ${l.type==='use'?'Scadenza di sicurezza':'Termine minimo di conservazione'} ${l.note?'· '+esc(l.note):''}</p>${bad?'<p class="small" style="color:#a52b27">Non consumare oltre la data «da consumarsi entro».</p>':''}<button class="alt" onclick="removeLot(${l.id})">Rimuovi / consumato</button></div>`}).join(''):'<p class="muted">Nessun prodotto ancora inserito.</p>'}<div class="notice">La data originale non basta per stimare la sicurezza dopo apertura o cottura. Per prodotti congelati registra anche la data di congelamento e segui le istruzioni di conservazione. «Preferibilmente entro» è un termine di qualità, non automaticamente di sicurezza.</div><div class="card"><h3>Backup dei dati</h3><button onclick="exportData()">Esporta backup JSON</button> <label>Ripristina un backup</label><input type="file" accept="application/json" onchange="importData(this)"><p class="muted">Il backup è importante: il salvataggio locale non sincronizza automaticamente telefoni o browser diversi.</p></div>`}
// Programmazione settimanale modificabile: il concerto di sabato è sempre lasciato libero.
function workoutDays(){const a=S.workoutDays;return Array.isArray(a)&&a.length===3&&new Set(a).size===3&&a.every(x=>Number.isInteger(x)&&x>=0&&x<=6)?a:[0,2,4]}

function setWorkoutDay(index,value){const d=Number(value),a=[...workoutDays()];if(a.some((x,i)=>i!==index&&x===d)){toast('Scegli un giorno diverso per ogni allenamento');render();return}if(weekEventActive()&&(d===5||d===6)){toast('Sabato e domenica sono riservati alla trasferta. Scegli un altro giorno.');render();return}a[index]=d;S.workoutDays=a;save();toast('📅 Allenamento spostato')}

function fitness(){const wd=workoutDays();return `<div class="kicker">DAJE! MOVE STUDIO</div><h2>💪 Allenamenti illustrati</h2><div class="card soft"><b>📅 Settimana organizzata attorno agli impegni</b><p class="muted">Lunedì: prove 10:30–13:30, allenamento breve prima delle prove. Mercoledì: mattina libera prima della terapia. Venerdì: mattina prima delle lezioni. Sabato e domenica: trasferta in Sicilia, recupero.</p><div class="workout-week">${days.map((d,i)=>`<div class="workout-day ${wd.includes(i)?'active':''} ${weekEventActive()&&i>=5?'travel':''}"><b>${d.slice(0,3)}</b><span>${wd.includes(i)?'💪 '+['A','B','C'][wd.indexOf(i)]:i===5?'🎤':i===6?'✈️':'🌿'}</span></div>`).join('')}</div><p class="muted">Puoi spostare gli allenamenti. Le giornate sono suggerimenti, non prenotazioni del calendario.</p>${W.map((w,i)=>`<label>Workout ${['A','B','C'][i]} · giorno</label><select onchange="setWorkoutDay(${i},this.value)">${days.map((d,j)=>`<option value="${j}" ${wd[i]===j?'selected':''} ${weekEventActive()&&j>=5?'disabled':''}>${d}${j===0?' · prove 10:30–13:30':''}${j===5?' · concerto':''}${j===6?' · trasferta':''}</option>`).join('')}</select>`).join('')}</div><div class="chiprow">${W.map((w,i)=>`<button class="${i===S.work?'':'alt'}" onclick="S.work=${i};save()">${['🟢','🟠','🔵'][i]} ${days[wd[i]]} · ${['A','B','C'][i]}</button>`).join('')}</div><div class="card soft"><h3>Workout ${['A','B','C'][S.work]} · ${days[wd[S.work]]}</h3><p class="muted">Principiante · 15–25 minuti adattabili · senza carico prolungato sui polsi</p></div><div class="exercise-grid">${W[S.work][1].map(([n,q],i)=>`<div class="exercise-card">${exerciseArt(n)}<div class="exercise-body"><b>${esc(n)}</b><p class="muted">${esc(q)}</p><label class="exercise-check"><input type="checkbox" ${S.done['e'+S.work+'-'+i]?'checked':''} onchange="S.done['e${S.work}-${i}']=this.checked;save()"> Fatto ✓</label></div></div>`).join('')}</div><div class="card"><label class="row"><input type="checkbox" ${S.done['w'+S.work]?'checked':''} onchange="S.done['w${S.work}']=this.checked;save();if(this.checked){celebrate();toast('💪 Allenamento completato!')}"> <b>Allenamento completato</b></label></div><div class="notice">Le illustrazioni sono schematiche e non sostituiscono una dimostrazione tecnica. Evita appoggi dolorosi sui polsi; interrompi in caso di dolore acuto o sintomi insoliti.</div>`}

const EMOJI=['🥙','🍝','🌯','🍛','🥪','🍢','🌮','🌯','🥖','🍝','🫓','🥔','🍚','🍕'];
const BGS=['linear-gradient(135deg,#fbe7ae,#e7aa65)','linear-gradient(135deg,#ffc9a3,#e97868)','linear-gradient(135deg,#f6dbad,#cda476)','linear-gradient(135deg,#f8dc92,#eab663)','linear-gradient(135deg,#cfe9d2,#8cbe9c)','linear-gradient(135deg,#e9d8c4,#c1a28c)','linear-gradient(135deg,#f4cd9b,#e1a56a)'];
function foodEmoji(i){return EMOJI[i]||'🍽️'}
function foodBg(i){return BGS[i%BGS.length]}
function showSheet(content){
 const root=document.getElementById('overlay-root');
 root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div>${content}<div style="margin-top:16px"><button class="alt" style="width:100%" onclick="closeSheet()">Chiudi</button></div></div></div>`;
 document.body.style.overflow='hidden';
}
function closeSheet(){document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';if(typeof timerInterval!=='undefined'){clearInterval(timerInterval);timerRunning=false}}
function toast(message){
 const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;
 setTimeout(()=>{root.innerHTML=''},2800)
}
function celebrate(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(let i=0;i<25;i++){
  const x=document.createElement('div');x.className='confetti';
  x.style.left=Math.random()*100+'vw';x.style.background=['#eebd62','#55aa7b','#e87d7b','#b3d8e9'][i%4];
  x.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),2300)
 }
}
function showTip(){
 const tips=['Per i pranzi da portare senza frigorifero, usa una borsa termica con ghiaccio sintetico.','Prima di fare la spesa controlla gli ingredienti che hai già: riduci sprechi e doppioni.','Scegli una ricetta con ingredienti prossimi alla scadenza, purché ancora sicuri.','Per iniziare a muoverti bastano piccoli passi regolari, senza forzare i polsi.'];
 showSheet(`<div style="font-size:55px;text-align:center">💡</div><h2>Il consiglio di oggi</h2><p>${tips[new Date().getDate()%tips.length]}</p>`)
}
function openMeal(day,category){
 if(isPaidMeal(day,category)){showSheet(`<h2>🎟️ Pasto offerto</h2><p>${esc(days[day])} · ${esc(category)}: pasto pagato durante la trasferta in Sicilia.</p><p class="muted">Non è necessario cucinare né acquistare ingredienti per questo pasto.</p>`);return}
 const n=getDayMenu(day).find(m=>m[1]===category)?.[0]||'Pasto';
 const i=R.findIndex(r=>r[0]===n);
 showSheet(`<div style="font-size:60px;text-align:center">${i>=0?foodEmoji(i):'🍽️'}</div><div class="kicker">${esc(days[day])} · ${esc(category)}</div><h2>${esc(n)}</h2><p class="muted">${i>=0?'Ricetta completa disponibile.':'Pasto presente nel menu settimanale.'}</p>${i>=0?`<button style="width:100%" onclick="closeSheet();S.tab='ricette';S.recipe=${i};save()">Apri ricetta completa →</button>`:''}`)
}
let cookingStep=0;
function startCooking(){cookingStep=0;renderCooking()}
function renderCooking(){
 const r=R[S.recipe],total=r[3].length;
 showSheet(`<div class="kicker">MODALITÀ CHEF · ${cookingStep+1}/${total}</div><h2>${esc(r[0])}</h2><div class="hero-food" style="min-height:150px;background:${foodBg(S.recipe)}"><div class="plate" style="height:120px;width:120px"><span style="font-size:64px">${foodEmoji(S.recipe)}</span></div></div><div class="meter"><i style="width:${(cookingStep+1)/total*100}%"></i></div><div class="card" style="font-size:18px;line-height:1.6"><b>Passaggio ${cookingStep+1}</b><p>${esc(r[3][cookingStep])}</p></div><div class="timer-active" id="timer-box"><b>⏱ Timer di cottura</b><div class="timer-display" id="timer-display">${formatTime(timerSeconds)}</div><div class="timer-presets"><button class="alt" onclick="setTimer(300)">5 min</button><button class="alt" onclick="setTimer(600)">10 min</button><button class="alt" onclick="setTimer(900)">15 min</button><button class="alt" onclick="setTimer(1200)">20 min</button></div><div class="row"><button class="grow" onclick="toggleTimer()">${timerRunning?'Pausa':'Avvia'}</button><button class="alt grow" onclick="resetTimer()">Azzera</button></div></div><div class="row" style="margin-top:14px"><button class="alt grow" ${cookingStep===0?'disabled':''} onclick="cookingStep--;renderCooking()">← Indietro</button><button class="grow" onclick="nextCooking()">${cookingStep===total-1?'Finito! 🎉':'Avanti →'}</button></div>`)
}
function nextCooking(){if(cookingStep<R[S.recipe][3].length-1){cookingStep++;renderCooking()}else{closeSheet();celebrate();showSheet('<div style="font-size:68px;text-align:center">🎉</div><h2>Complimenti, chef!</h2><p>Hai completato la preparazione. Quando hai effettivamente usato gli ingredienti, conferma l’aggiornamento della dispensa dalla scheda ricetta.</p>')}}


const PHOTO_IDS=['photo-1547592180-85f173990554','photo-1473093295043-cdd812d0e601','photo-1528735602780-2552fd46c7af','photo-1603894584373-5ac82b2ae398','photo-1553909489-cd47e0ef937f','photo-1529006557810-274b9b2fc783','photo-1512621776951-a57141f2eefd','photo-1559847844-5315695dadae','photo-1509440159596-0249088772ff','photo-1473093295043-cdd812d0e601','photo-1547592180-85f173990554','photo-1512621776951-a57141f2eefd','photo-1512058564366-18510be2db19','photo-1565299624946-b28f40a0ae38'];
function photoURL(i){return PHOTO_IDS[i]?'https://images.unsplash.com/'+PHOTO_IDS[i]+'?auto=format&fit=crop&w=900&q=75':''}
function foodPhoto(i){return `<div class="photo-hero fade-in"><img src="${(S.photos||{})[i]||photoURL(i)}" alt="Fotografia gastronomica illustrativa" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="photo-fallback">${foodEmoji(i)}</div><div class="photo-shade"><b>${esc(R[i][0])}</b><div class="photo-credit">${(S.photos||{})[i]?'La tua foto':'Foto illustrativa · richiede connessione'}</div></div></div>`}
function searchRecipes(q){
 const box=document.getElementById('recipe-search-results');if(!box)return;
 const term=q.toLocaleLowerCase('it').trim();
 if(!term){box.innerHTML='';return}
 const matches=R.map((r,i)=>({r,i})).filter(({r})=>r[0].toLocaleLowerCase('it').includes(term)||r[2].some(x=>x[0].toLocaleLowerCase('it').includes(term)));
 box.innerHTML=`<div class="muted">${matches.length} ricette trovate</div><div class="search-results">${matches.map(({r,i})=>`<button class="search-result" onclick="S.recipe=${i};save()"><div class="pic"><img loading="lazy" src="${(S.photos||{})[i]||photoURL(i)}" alt="" onerror="this.parentElement.innerHTML='${foodEmoji(i)}'"></div><strong>${esc(r[0])}</strong></button>`).join('')}</div>`;
}
function filterCards(query,klass){
 const q=query.toLocaleLowerCase('it').trim();
 document.querySelectorAll('.'+klass).forEach(el=>el.style.display=(el.dataset.search||'').includes(q)?'':'none')
}
let timerSeconds=0,timerRunning=false,timerInterval=null,timerEndsAt=0;
function formatTime(sec){let s=Math.max(0,Math.ceil(sec));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateTimerView(){let el=document.getElementById('timer-display');if(el)el.textContent=formatTime(timerSeconds);let box=document.getElementById('timer-box');if(box)box.classList.toggle('running',timerRunning)}
function setTimer(sec){timerSeconds=sec;timerRunning=false;clearInterval(timerInterval);updateTimerView();renderCooking()}
function resetTimer(){setTimer(0)}
function toggleTimer(){
 if(timerRunning){timerSeconds=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000));timerRunning=false;clearInterval(timerInterval);renderCooking();return}
 if(timerSeconds<=0){toast('Scegli prima la durata del timer');return}
 timerRunning=true;timerEndsAt=Date.now()+timerSeconds*1000;clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
  timerSeconds=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000));
  updateTimerView();
  if(timerSeconds===0){clearInterval(timerInterval);timerRunning=false;toast('⏰ Timer terminato!');try{navigator.vibrate?.([150,100,150])}catch(e){};renderCooking()}
 },250);
 renderCooking()
}


// Planner V8: porzioni per singolo pasto, con ricette base da 2 persone.
function mealKey(day,category){return day+'|'+category}
function getMealPortions(day,category){const v=Number((S.mealPortions||{})[mealKey(day,category)]);return Number.isInteger(v)&&v>=1&&v<=12?v:2}
function setMealPortions(day,category,value){const n=Number(value);if(!Number.isInteger(n)||n<1||n>12)return;S.mealPortions=S.mealPortions||{};S.mealPortions[mealKey(day,category)]=n;save();openPlanner(false)}
function plannerMeal(day,cat){return getDayMenu(day).find(m=>m[1]===cat)}
function plannerCard(day,cat){
 if(isPaidMeal(day,cat))return `<div class="planner-card paid-slot"><div class="meal-label">${esc(cat)} · 🎟️ OFFERTA</div><div class="meal-name">🍽️ Pasto pagato</div><p class="muted">Nessuna ricetta da preparare e nessun ingrediente in spesa.</p><button class="alt" onclick="togglePaidMeals();openPlanner(false)">Modifica esclusione</button></div>`;
 const item=plannerMeal(day,cat);if(!item)return '';
 const [name]=item,portions=getMealPortions(day,cat),hasRecipe=R.some(r=>r[0].toLocaleLowerCase('it')===name.trim().toLocaleLowerCase('it'));
 return `<div class="planner-card" draggable="true" data-day="${day}" data-cat="${cat}" ondragstart="plannerDrag(event,${day},'${cat}')" ondragover="plannerOver(event)" ondragleave="this.classList.remove('drop-target')" ondrop="plannerDrop(event,${day},'${cat}')" ondragend="plannerDragEnd()"><div class="meal-label">${esc(cat)} ${hasRecipe?'✓':'· senza ricetta'}</div><div class="meal-name">${esc(name)}</div><div class="portion-row"><label style="font-size:11px">👥 Persone</label><select aria-label="Porzioni per ${esc(name)}" onchange="setMealPortions(${day},'${cat}',this.value)">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${portions===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><div class="card-actions"><button class="alt" onclick="pickPlannerMeal(${day},'${cat}')">✏️ Cambia</button><button class="alt" onclick="movePlannerMeal(${day},'${cat}')">↔ Sposta</button></div></div>`
}
function plannerHTML(){return `<div class="kicker">DAJE! SMART PLANNER</div><h2>📅 La tua settimana</h2>${weekEventActive()?`<div class="paid-meal"><b>🎟️ Sicilia: 4 pasti già pagati</b><p>Sabato pranzo e cena, domenica colazione e cena sono mostrati come pasti offerti, non ricette. Il pranzo di domenica resta da organizzare.</p><label><input type="checkbox" ${!S.includePaidMeals?'checked':''} onchange="togglePaidMeals();openPlanner(false)"> Escludi pasti offerti dalla spesa</label></div>`:''}<p class="planner-foot">Trascina un pasto su un altro per scambiarli. Sul telefono usa «Sposta» per scegliere la destinazione. Le porzioni aggiornano subito la spesa.</p><div class="planner-toolbar"><button onclick="closeSheet();S.tab='spesa';save()">🛒 Vedi spesa aggiornata</button><button class="alt" onclick="resetPlanner()">↺ Ripristina porzioni</button></div><div class="planner-scroll-hint">← Scorri per vedere tutti i giorni →</div><div class="planner-grid">${days.map((day,d)=>`<div class="planner-col"><h4>${day}</h4>${['Colazione','Pranzo','Cena'].map(cat=>plannerCard(d,cat)).join('')}</div>`).join('')}</div><p class="planner-foot">Le ricette sono definite per 2 persone. Le quantità sono proporzionali, ma tempi di cottura, confezioni e arrotondamenti potrebbero non scalare linearmente.</p>`}
function openPlanner(resetScroll=true){const old=document.querySelector('.planner-grid');const x=!resetScroll&&old?old.scrollLeft:0;showSheet(plannerHTML());const el=document.querySelector('.planner-grid');if(el)el.scrollLeft=x}
let plannerSource=null;
function plannerDrag(e,day,cat){plannerSource={day,cat};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',mealKey(day,cat));e.currentTarget.classList.add('dragging')}
function plannerOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drop-target')}
function plannerDragEnd(){document.querySelectorAll('.planner-card').forEach(el=>el.classList.remove('dragging','drop-target'))}
function plannerDrop(e,day,cat){e.preventDefault();const source=plannerSource;plannerDragEnd();if(source)swapPlannerMeals(source.day,source.cat,day,cat);plannerSource=null}
function swapPlannerMeals(d1,c1,d2,c2){
 if(d1===d2&&c1===c2)return;
 const a=getDayMenu(d1).map(x=>[...x]),b=d1===d2?a:getDayMenu(d2).map(x=>[...x]);
 const i=a.findIndex(x=>x[1]===c1),j=b.findIndex(x=>x[1]===c2);if(i<0||j<0)return;
 const nameA=a[i][0],nameB=b[j][0];a[i][0]=nameB;b[j][0]=nameA;
 S.customMenu=S.customMenu||{};S.customMenu[d1]=a;S.customMenu[d2]=b;
 S.mealPortions=S.mealPortions||{};
 const p1=getMealPortions(d1,c1),p2=getMealPortions(d2,c2);
 S.mealPortions[mealKey(d1,c1)]=p2;S.mealPortions[mealKey(d2,c2)]=p1;
 save();openPlanner(false);toast('🔄 Pasti e porzioni scambiati')
}
function movePlannerMeal(day,cat){
 const destinations=days.flatMap((d,i)=>['Colazione','Pranzo','Cena'].filter(c=>!(i===day&&c===cat)).map(c=>({day:i,cat:c,name:plannerMeal(i,c)?.[0]||''})));
 showSheet(`<div class="kicker">SPOSTA IL PASTO</div><h2>↔ ${esc(plannerMeal(day,cat)[0])}</h2><p>Scegli il pasto con cui scambiarlo. Verranno scambiate anche le porzioni.</p><div class="planner-sheet-list">${destinations.map(x=>`<button class="alt" onclick="swapPlannerMeals(${day},'${cat}',${x.day},'${x.cat}')">${days[x.day]} · ${x.cat}<br><small>${esc(x.name)}</small></button>`).join('')}</div>`)
}
function pickPlannerMeal(day,cat){
 const current=plannerMeal(day,cat)[0];
 showSheet(`<div class="kicker">CAMBIA RICETTA</div><h2>${days[day]} · ${cat}</h2><label>Nome del pasto</label><input id="planner-new-name" value="${esc(current)}" list="planner-recipe-names" maxlength="130"><datalist id="planner-recipe-names">${R.map(r=>`<option value="${esc(r[0])}">`).join('')}</datalist><p class="muted">Seleziona una ricetta registrata per includere i suoi ingredienti nella spesa.</p><button onclick="savePlannerMeal(${day},'${cat}')">Salva pasto</button>`)
}
function savePlannerMeal(day,cat){const name=document.getElementById('planner-new-name').value.trim();if(!name)return alert('Inserisci un nome.');const vals=getDayMenu(day).map(x=>[...x]);const i=vals.findIndex(x=>x[1]===cat);if(i<0)return;vals[i][0]=name;S.customMenu=S.customMenu||{};S.customMenu[day]=vals;save();openPlanner();toast('Pasto aggiornato')}
function resetPlanner(){if(!confirm('Ripristinare tutte le porzioni a 2 persone? I pasti rimarranno invariati.'))return;S.mealPortions={};save();openPlanner(false)}

// Versione 5: tutte le preferenze rimangono nello stesso salvataggio locale.
function getDayMenu(day){return (S.customMenu||{})[day]||menu[day]}
function editDayMenu(day){
 const vals=getDayMenu(day);
 showSheet(`<div class="kicker">PIANO SETTIMANALE</div><h2>✏️ ${days[day]}</h2><p class="muted">Scegli una ricetta o scrivi un pasto. Solo le ricette registrate entrano nella spesa automatica.</p>${vals.map(([name,cat],i)=>`<div class="meal-edit-row"><label>${esc(cat)}</label><input id="meal-edit-${i}" value="${esc(name)}" maxlength="130" list="recipe-names"></div>`).join('')}<datalist id="recipe-names">${R.map(r=>`<option value="${esc(r[0])}">`).join('')}</datalist><button style="width:100%" onclick="saveDayMenu(${day})">Salva i pasti</button><button class="alt" style="width:100%;margin-top:8px" onclick="resetDayMenu(${day})">Ripristina menu originale</button>`)
}
function saveDayMenu(day){
 const vals=getDayMenu(day).map(([name,cat],i)=>[document.getElementById('meal-edit-'+i).value.trim()||name,cat]);
 S.customMenu=S.customMenu||{};S.customMenu[day]=vals;closeSheet();save();toast('📅 Menu aggiornato!')
}
function resetDayMenu(day){if(!confirm('Ripristinare il menu originale di '+days[day]+'?'))return;S.customMenu=S.customMenu||{};delete S.customMenu[day];closeSheet();save()}
function toggleFavorite(i){S.favorites=S.favorites||[];if(S.favorites.includes(i))S.favorites=S.favorites.filter(x=>x!==i);else S.favorites.push(i);save();toast(S.favorites.includes(i)?'❤️ Aggiunta ai preferiti':'Rimossa dai preferiti')}
function openFavorites(){
 const ids=(S.favorites||[]).filter(i=>R[i]);
 showSheet(`<div class="kicker">IL TUO RICETTARIO</div><h2>❤️ Preferiti</h2>${ids.length?`<div class="fav-grid">${ids.map(i=>`<button class="fav-tile" onclick="closeSheet();S.tab='ricette';S.recipe=${i};save()"><img src="${(S.photos||{})[i]||photoURL(i)}" alt="" onerror="this.style.display='none'"><b>${esc(R[i][0])}</b></button>`).join('')}</div>`:'<p>Non hai ancora aggiunto ricette. Apri una ricetta e premi 🤍 Salva preferito.</p>'}`)
}
function choosePhoto(i){
 showSheet(`<div class="kicker">PERSONALIZZA LA RICETTA</div><h2>📷 Foto di ${esc(R[i][0])}</h2><p>Carica una foto dal telefono. Sarà ridimensionata e salvata soltanto in questo dispositivo, insieme ai dati dell’app.</p><input class="photo-upload" type="file" accept="image/*" onchange="uploadRecipePhoto(this,${i})"><p class="muted">Foto consigliata: orizzontale. Per proteggere lo spazio di archiviazione viene compressa.</p>${(S.photos||{})[i]?`<button class="alt" onclick="removeRecipePhoto(${i})">Rimuovi la mia foto</button>`:''}`)
}
function uploadRecipePhoto(el,i){
 const file=el.files&&el.files[0];if(!file)return;
 if(file.size>15*1024*1024){alert('Scegli una foto sotto 15 MB.');return}
 const reader=new FileReader();reader.onerror=()=>alert('Impossibile leggere la foto');reader.onload=()=>{
  const img=new Image();img.onerror=()=>alert('Formato immagine non supportato');img.onload=()=>{
   const canvas=document.createElement('canvas');const ratio=Math.min(1,1000/img.width,700/img.height);canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   const encoded=canvas.toDataURL('image/jpeg',.67);
   const prev=S.photos||{};S.photos={...prev,[i]:encoded};
   try{localStorage.setItem('daje-v1',JSON.stringify(S));closeSheet();render();toast('📸 Foto salvata!')}catch(e){S.photos=prev;alert('Spazio locale esaurito. Elimina qualche foto o esporta un backup.')}
  };img.src=reader.result
 };reader.readAsDataURL(file)
}
function removeRecipePhoto(i){S.photos=S.photos||{};delete S.photos[i];closeSheet();save()}
const HOME_WIDGETS=[['expiry','⏰ Scadenze'],['favorites','❤️ Ricette preferite'],['shopping','🛒 Spesa da fare'],['progress','📈 Il tuo percorso']];
function homeBlocks(){
 const enabled=S.homeWidgets||['expiry','favorites','shopping','progress'];
 return enabled.map(id=>{
 if(id==='expiry')return `<div class="home-widget">${expiryPanel()}</div>`;
 if(id==='favorites')return `<div class="card home-widget"><b>❤️ I tuoi preferiti</b><p class="muted">${(S.favorites||[]).length} ricette salvate</p><button class="alt" onclick="openFavorites()">Apri ricettario →</button></div>`;
 if(id==='shopping')return `<div class="card home-widget"><b>🛒 La spesa</b><p class="muted">${G.filter(p=>need(p)>0).length} prodotti da acquistare</p><button class="alt" onclick="S.tab='spesa';save()">Apri lista →</button></div>`;
 if(id==='progress'){const last=S.logs[S.logs.length-1];return `<div class="card home-widget"><b>📈 Il tuo percorso</b><p class="muted">${last&&last.weight?'Ultimo peso registrato: '+esc(last.weight)+' kg':'Nessun peso ancora registrato'}</p><button class="alt" onclick="document.getElementById('logweight')?.focus()">Aggiorna diario ↓</button></div>`}
 return ''
 }).join('')
}
function customizeHome(){
 const enabled=S.homeWidgets||['expiry','favorites','shopping','progress'];
 showSheet(`<div class="kicker">PERSONALIZZA</div><h2>⚙️ La tua Home</h2><p>Attiva o nascondi i riquadri e cambiane l'ordine.</p>${(S.homeOrder||HOME_WIDGETS.map(x=>x[0])).map(id=>{const label=HOME_WIDGETS.find(x=>x[0]===id)[1];return `<div class="home-option"><input type="checkbox" id="home-${id}" ${enabled.includes(id)?'checked':''}><label for="home-${id}" style="flex:1">${label}</label><button class="alt" onclick="moveHome('${id}',-1)">↑</button><button class="alt" onclick="moveHome('${id}',1)">↓</button></div>`}).join('')}<button style="width:100%;margin-top:14px" onclick="saveHomeWidgets()">Salva Home</button>`)
}
function moveHome(id,dir){
 const order=S.homeOrder||HOME_WIDGETS.map(x=>x[0]);const i=order.indexOf(id),j=i+dir;if(j<0||j>=order.length)return;
 const checks=Object.fromEntries(HOME_WIDGETS.map(([key])=>[key,!!document.getElementById('home-'+key)?.checked]));
 const next=[...order];[next[i],next[j]]=[next[j],next[i]];S.homeOrder=next;
 const container=document.querySelector('.sheet');const rows=[...container.querySelectorAll('.home-option')];
 const lookup=Object.fromEntries(rows.map(row=>[row.querySelector('input').id.slice(5),row]));
 const marker=rows[rows.length-1].nextSibling;
 next.forEach(key=>container.insertBefore(lookup[key],marker));
 HOME_WIDGETS.forEach(([key])=>{const el=document.getElementById('home-'+key);if(el)el.checked=checks[key]})
}
function saveHomeWidgets(){
 const chosen=HOME_WIDGETS.map(x=>x[0]).filter(id=>document.getElementById('home-'+id)?.checked);
 const order=S.homeOrder||HOME_WIDGETS.map(x=>x[0]);S.homeWidgets=order.filter(id=>chosen.includes(id));closeSheet();save();toast('✨ Home personalizzata!')
}


// Lista dinamica: somma le ricette effettivamente presenti nel calendario.
// I pasti senza una ricetta associata vengono segnalati, non stimati.
function planShopping(){
 const items=new Map(),unlinked=[];
 for(let d=0;d<7;d++)for(const [name,meal] of getDayMenu(d)){
  if(isPaidMeal(d,meal))continue;
  const r=R.find(x=>x[0].toLocaleLowerCase('it')===name.trim().toLocaleLowerCase('it'));
  if(!r){unlinked.push(days[d]+' · '+meal+': '+name);continue}
  for(const [ingredient,qty,unit] of r[2]){
   const key=ingredient.toLowerCase()+'|'+unit;
   if(!items.has(key))items.set(key,{name:ingredient,qty:0,unit,cat:(G.find(g=>g[0].toLowerCase()===ingredient.toLowerCase()&&g[2]===unit)||[])[3]||'Altri ingredienti'});
   items.get(key).qty+=Number(qty)*getMealPortions(d,meal)/2;
  }
 }
 return {items:[...items.values()],unlinked};
}
function shoppingNeed(p){return Math.max(0,Math.round((p.qty-stock(p.name,p.unit))*100)/100)}
function dynamicShop(){
 const {items,unlinked}=planShopping();let cats=[...new Set(items.map(x=>x.cat))];
 const missing=items.filter(x=>shoppingNeed(x)>0);
 return `<h2>🛒 Spesa dal tuo menu</h2>${weekEventActive()?`<div class="paid-meal"><b>🎤 Settimana Sicilia</b><p class="muted">${S.includePaidMeals?"Pasti offerti attualmente inclusi":"4 pasti offerti esclusi dal calcolo"}. Puoi cambiare l’impostazione dalla Home.</p></div>`:""}<p class="muted">Le quantità si aggiornano quando cambi le ricette del calendario e sottraggono ciò che hai in dispensa. Calcolate dalle ricette registrate, proporzionate alle persone impostate per ciascun pasto.</p><div class="card soft"><button class="alt" onclick="openPlanner()">📅 Modifica piano e porzioni</button><b>${missing.length} ingredienti da acquistare</b><p class="muted">${items.length} ingredienti nel piano · ${unlinked.length} pasti senza ricetta collegata</p><button class="alt" onclick="copyDynamicShop()">📋 Copia lista aggiornata</button><button class="alt" onclick="showUnlinkedMeals()">⚠️ Pasti non conteggiati (${unlinked.length})</button></div>
 <div class="search-field"><input placeholder="Cerca ingredienti…" oninput="filterCards(this.value,'dynamic-item')"></div>
 ${cats.map(cat=>`<details open><summary>${esc(cat)}</summary>${items.filter(x=>x.cat===cat).map(p=>{let n=shoppingNeed(p);let key=p.name+'|'+p.unit;return `<div class="card dynamic-item" data-search="${esc(p.name.toLowerCase())}"><div class="row between"><div><b>${esc(p.name)}</b><div class="muted">Menu ${p.qty} ${esc(p.unit)} · Dispensa ${stock(p.name,p.unit)} ${esc(p.unit)}</div><strong>${n?'Compra '+n+' '+esc(p.unit):'✓ Già disponibile'}</strong></div>${n?`<label><input type="checkbox" ${S.bought[key]?'checked':''} onchange="S.bought[${JSON.stringify(key)}]=this.checked;save()">Preso</label>`:''}</div></div>`}).join('')}</details>`).join('')}
 <div class="notice">Importante: colazioni e pasti non associati a ricette non sono inclusi nel calcolo. Controlla la sezione «Pasti non conteggiati» e aggiungili alla spesa manualmente. Le unità diverse (pezzi, grammi, confezioni) non vengono convertite automaticamente.</div>`;
}
function showUnlinkedMeals(){let {unlinked}=planShopping();showSheet(`<h2>⚠️ Pasti non conteggiati</h2><p>Per questi pasti non esiste una ricetta con ingredienti registrati, quindi non ho inventato quantità.</p>${unlinked.length?unlinked.map(x=>`<p>• ${esc(x)}</p>`).join(''):'<p>Tutti i pasti sono collegati!</p>'}`)}
function copyDynamicShop(){const {items,unlinked}=planShopping();const str=items.filter(p=>shoppingNeed(p)>0).map(p=>`${S.bought[p.name+'|'+p.unit]?'☑':'☐'} ${p.name}: ${shoppingNeed(p)} ${p.unit}`).join('\n')+'\n\nPasti non conteggiati:\n'+unlinked.join('\n');navigator.clipboard?.writeText?navigator.clipboard.writeText(str).then(()=>toast('📋 Lista copiata')).catch(()=>prompt('Copia la lista:',str)):prompt('Copia la lista:',str)}


// Ricette personali: salvataggio nello stesso backup JSON della versione precedente.
function editCustomRecipe(i=-1){
 const r=i>=BUILTIN_RECIPES?R[i]:null;
 const ingredients=r?r[2]:[['',100,'g']];
 showSheet(`<div class="kicker">IL TUO RICETTARIO</div><h2>${r?'✏️ Modifica':'➕ Crea'} ricetta</h2>
 <label>Nome del piatto</label><input id="cr-name" maxlength="110" value="${esc(r?r[0]:'')}" placeholder="Es. Udon al pollo e verdure">
 <label>Preparazione (minuti)</label><input id="cr-time" type="number" min="1" max="1440" value="${r?r[1]:25}">
 <h3>Ingredienti per 2 persone</h3><p class="muted">Usa lo stesso nome e la stessa unità della dispensa per sottrarre le scorte.</p>
 <div id="cr-ingredients">${ingredients.map(([name,qty,unit])=>ingredientEditor(name,qty,unit)).join('')}</div>
 <button class="alt" onclick="addIngredientEditor()">+ Aggiungi ingrediente</button>
 <h3>Preparazione</h3><p class="muted">Un passaggio per riga.</p>

 <button style="width:100%;margin-top:12px" onclick="saveCustomRecipe(${i})">💾 Salva ricetta</button>`)
}
function ingredientEditor(name='',qty=100,unit='g'){
 return `<div class="card cr-ingredient" style="margin:7px 0"><input class="cr-ing-name" placeholder="Ingrediente, es. Pollo" maxlength="80" value="${esc(name)}" list="pantry-names"><div class="row" style="margin-top:7px"><input class="cr-ing-qty" type="number" min="0.01" step="any" value="${qty}" aria-label="Quantità"><select class="cr-ing-unit" aria-label="Unità">${['g','kg','ml','l','pz','conf','bustine','bottiglie','buste','teste'].map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select><button class="alt" onclick="this.closest('.cr-ingredient').remove()">✕</button></div></div>`
}
function addIngredientEditor(){document.getElementById('cr-ingredients').insertAdjacentHTML('beforeend',ingredientEditor())}
function saveCustomRecipe(i){
 const name=document.getElementById('cr-name').value.trim(),time=Number(document.getElementById('cr-time').value);
 const rows=[...document.querySelectorAll('.cr-ingredient')];
 const ingredients=rows.map(el=>[el.querySelector('.cr-ing-name').value.trim(),Number(el.querySelector('.cr-ing-qty').value),el.querySelector('.cr-ing-unit').value]);
 const steps=document.getElementById('cr-steps').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
 if(!name||name.length>110||!Number.isFinite(time)||time<1||time>1440||!ingredients.length||ingredients.some(x=>!x[0]||!Number.isFinite(x[1])||x[1]<=0)||!steps.length){alert('Completa nome, minuti, almeno un ingrediente con quantità positiva e un passaggio.');return}
 if(R.some((r,j)=>j!==i&&r[0].toLocaleLowerCase('it')===name.toLocaleLowerCase('it'))){alert('Esiste già una ricetta con questo nome. Scegli un nome diverso.');return}
 const recipe=[name,time,ingredients,steps];
 if(i>=BUILTIN_RECIPES){
  const old=R[i][0];R[i]=recipe;
  if(old!==name&&S.customMenu)for(const day of Object.keys(S.customMenu))S.customMenu[day]=S.customMenu[day].map(([n,c])=>[n===old?name:n,c]);
 }else{R.push(recipe);i=R.length-1}
 S.userRecipes=R.slice(BUILTIN_RECIPES);S.recipe=i;
 try{localStorage.setItem('daje-v1',JSON.stringify(S))}catch(e){alert('Spazio esaurito. Esporta un backup e libera spazio.');return}
 closeSheet();render();celebrate();toast('🍽️ Ricetta salvata! Ora puoi aggiungerla al calendario.')
}
function deleteCustomRecipe(i){
 if(i<BUILTIN_RECIPES||!confirm('Eliminare definitivamente questa ricetta? I pasti già nel calendario resteranno con il loro nome ma non saranno più conteggiati nella spesa.'))return;
 R.splice(i,1);S.userRecipes=R.slice(BUILTIN_RECIPES);
 S.favorites=(S.favorites||[]).filter(x=>x!==i).map(x=>x>i?x-1:x);
 const photos={};for(const [k,v] of Object.entries(S.photos||{})){let n=Number(k);if(n!==i)photos[n>i?n-1:n]=v}S.photos=photos;
 S.recipe=Math.max(0,Math.min(i,R.length-1));save();toast('Ricetta eliminata')
}

function undoCook(){if(!Array.isArray(S.lastCookUndo))return;S.lots=S.lastCookUndo;delete S.lastCookUndo;closeSheet();save();toast('↩️ Ultima cottura annullata')}
function rebuildUserRecipes(){R.splice(BUILTIN_RECIPES);if(Array.isArray(S.userRecipes))for(const r of S.userRecipes){if(Array.isArray(r)&&r.length===4)R.push(r)};if(S.recipe>=R.length)S.recipe=0}

// Eventi confermati per la settimana 19–25 ottobre 2026. Sono separati dal menu abituale.
const SPECIAL_WEEK_START='2026-10-19',SPECIAL_WEEK_END='2026-10-25';
const SPECIAL_EVENTS=[
 {date:'2026-10-19',title:'Prove in studio',time:'10:30–13:30',icon:'🥁',detail:'Pranzo dopo le prove: prepara qualcosa di pratico o pianifica una pausa.'},
 {date:'2026-10-24',title:'Concerto in Sicilia',time:'Orario da definire',icon:'🎤',detail:'Pranzo e cena pagati: non aggiungerli alla spesa.'},
 {date:'2026-10-25',title:'Trasferta / rientro',time:'Orario da definire',icon:'✈️',detail:'Colazione e cena pagate: non aggiungerle alla spesa.'}
];
const PAID_MEALS={'2026-10-24':['Pranzo','Cena'],'2026-10-25':['Colazione','Cena']};
function weekEventActive(){const d=now();return d>=SPECIAL_WEEK_START&&d<=SPECIAL_WEEK_END}
function dateForWeekday(day){const base=new Date(SPECIAL_WEEK_START+'T12:00:00');base.setDate(base.getDate()+day);return base.toLocaleDateString('sv-SE')}
function isPaidMeal(day,cat){return weekEventActive()&&!(S.includePaidMeals||false)&&(PAID_MEALS[dateForWeekday(day)]||[]).includes(cat)}
function eventMealName(day,cat){return isPaidMeal(day,cat)?'🍽️ Pasto offerto · fuori casa':null}
function togglePaidMeals(){S.includePaidMeals=!S.includePaidMeals;save();toast(S.includePaidMeals?'Pasti offerti inclusi nella spesa':'Pasti offerti esclusi dalla spesa')}
function eventCard(){if(!weekEventActive())return '';
 const todayEvents=SPECIAL_EVENTS.filter(e=>e.date>=now());
 return `<div class="event-banner"><span class="event-chip">🎸 SETTIMANA LIVE · 19–25 OTT</span><h3>Il tuo programma musicale</h3>${SPECIAL_EVENTS.map(e=>`<p><b>${e.icon} ${e.date.slice(8)}/10 — ${esc(e.title)}</b><br>${esc(e.time)} · ${esc(e.detail)}</p>`).join('')}<button onclick="showTravelSheet()">🎒 Checklist trasferta · ${travelChecklist().filter(x=>(S.travelChecks||{})[x[0]]).length}/${travelChecklist().length} preparati →</button></div><div class="card soft"><b>🛒 Spesa più intelligente</b><p class="muted">Sabato pranzo e cena, domenica colazione e cena sono offerti. Per questa settimana puoi escluderli dal calcolo della spesa.</p><label><input type="checkbox" ${!S.includePaidMeals?'checked':''} onchange="togglePaidMeals()"> Escludi i 4 pasti offerti dalla spesa</label><p class="muted">Domenica il pranzo rimane da organizzare. Non presumo che sia offerto.</p></div>`
}
function travelChecklist(){return [['bacchette','🥁 Bacchette + ricambi'],['in-ear','🎧 In-ear / cuffie'],['caricatore','🔌 Caricatore e power bank'],['documenti','🪪 Documenti e biglietti'],['vestiti','👕 Outfit concerto + ricambio'],['acqua','💧 Acqua e snack per gli spostamenti']]}
function showTravelSheet(){showSheet(`<div class="kicker">SICILIA · SABATO 24 OTTOBRE</div><h2>🎸 Checklist concerto</h2><p>Spunta quello che hai preparato: le scelte rimangono salvate.</p><div class="travel-check" style="grid-template-columns:1fr">${travelChecklist().map(([key,label])=>`<button class="${(S.travelChecks||{})[key]?'done':''}" onclick="S.travelChecks=S.travelChecks||{};S.travelChecks['${key}']=!S.travelChecks['${key}'];save();showTravelSheet()">${(S.travelChecks||{})[key]?'✓ ':'○ '}${label}</button>`).join('')}</div><p class="muted">Checklist modificabile nelle prossime versioni. Controlla sempre le necessità effettive del concerto.</p>`)}
function recipeGallery(){const ids=[3,1,5,9,13,6,0,12];return `<div class="gallery-intro"><div><div class="kicker">ISPIRAZIONI</div><h3 style="margin:2px 0">Cosa cuciniamo? 🍴</h3></div><button class="alt" onclick="S.tab='ricette';save()">Tutte →</button></div><div class="visual-rail">${ids.map(i=>`<button class="visual-tile" onclick="S.tab='ricette';S.recipe=${i};save()"><img loading="lazy" src="${photoURL(i)}" alt="Immagine gastronomica illustrativa" onerror="this.style.display='none'"><div class="label">${foodEmoji(i)} ${esc(R[i][0])}</div></button>`).join('')}</div>`}

function addLot(){let name=$('pn').value.trim(),qty=Number($('pq').value),exp=$('pe').value;if(!name||!(qty>0)||!exp){alert('Inserisci nome, quantità positiva e data.');return}S.lots.push({id:Date.now()+Math.random(),name,qty,unit:$('pu').value,exp,type:$('pt').value,place:$('pl').value,opened:$('po').value,note:$('pnote').value.trim()});save()}
function removeLot(id){if(confirm('Rimuovere questo lotto dalla dispensa?')){S.lots=S.lots.filter(l=>l.id!==id);save()}}
function addLog(){S.logs.push({date:now(),weight:$('logweight').value,pain:$('logpain').value,energy:$('logenergy').value,hunger:$('loghunger').value,notes:$('lognotes').value});save()}
function copyShop(){let str=G.filter(p=>need(p)>0).map(p=>`${S.bought[p[0]]?'☑':'☐'} ${p[0]}: ${need(p)} ${p[2]}`).join('\n');navigator.clipboard?.writeText?navigator.clipboard.writeText(str).then(()=>alert('Lista copiata!')).catch(()=>prompt('Copia la lista:',str)):prompt('Copia la lista:',str)}
function exportData(){let b=new Blob([JSON.stringify({...S,lastCookUndo:undefined},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daje-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.lots)||!Array.isArray(x.logs))throw Error();if(confirm('Sostituire i dati attuali con quelli del backup?')){S=Object.assign({},DEFAULT,x);rebuildUserRecipes();save()}}catch(e){alert('Backup non valido')}};r.readAsText(f)}
render();
notifyExpiries();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
